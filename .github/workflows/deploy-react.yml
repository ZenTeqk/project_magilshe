name: Deploy Magilshe Application

on:
  push:
    paths:
      - 'Admin/**'
      - 'Website/**'

permissions:
  id-token: write    # Needed for OIDC authentication
  contents: read     # Needed to checkout the repo

jobs:
  check-changed-directories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Fetch last 2 commits for comparison

      - name: Get changed directories
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          dir_names: true
          diff_relative: true  # Optionally, make paths relative

      - name: Echo changed directories
        run: |
          echo "Changed directories:"
          echo ${{ steps.changed-files.outputs.all_changed_directories }}

