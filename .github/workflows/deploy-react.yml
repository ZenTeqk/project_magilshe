name: Deploy React Apps to S3 + CloudFront

on:
  push:
    paths:
      - 'Admin/**'
      - 'Website/**'

permissions:
  id-token: write    # needed for OIDC
  contents: read     # to checkout code

jobs:
  deploy-admin:
    name: Deploy Admin Panel
    if: ${{ contains(github.event.head_commit.message, 'Admin') || contains(join(github.event.head_commit.modified, ','), 'Admin/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.Github_OIDC }}
          aws-region: ap-south-1

      - name: Build React App
        working-directory: ./Admin
        env:
          REACT_APP_API_URL:        ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_IS_SKIP_OTP:    ${{ secrets.REACT_APP_IS_SKIP_OTP }}
        run: |
          npm ci
          npm run build

      - name: Deploy to S3
        run: aws s3 sync ./Admin/build s3://magilshe-admin-panel --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E27SJZON2LM1AS \
            --paths "/*"

  deploy-website:
    name: Deploy website
    if: ${{ contains(github.event.head_commit.message, 'Website') || contains(join(github.event.head_commit.modified, ','), 'Website/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.Github_OIDC }}
          aws-region: us-east-1

      - name: Build React App
        working-directory: ./Website
        env:
          REACT_APP_API_URL:        ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_IS_SKIP_OTP:    ${{ secrets.REACT_APP_IS_SKIP_OTP }}
        run: |
          npm ci
          npm run build

      - name: Deploy to S3
        run: aws s3 sync ./Website/build s3://magilshe-website --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E37BBO03VZXP2F \
            --paths "/*"
