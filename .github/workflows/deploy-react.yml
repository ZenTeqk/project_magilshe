name: Deploy React Apps to S3 + CloudFront

on:
  push:
    paths:
      - 'Admin/**'
      - 'Website/**'

permissions:
  id-token: write    # needed for OIDC
  contents: read     # to checkout code

jobs:
  get-changed-files:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.get_changed_files.outputs.files }}
    steps:
      - uses: actions/checkout@v3

      - name: Fetch previous commit to compare
        run: git fetch --depth=2

      - name: Get changed files
        id: get_changed_files
        run: |
          # Compare the previous commit with the current commit
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})

          # Debug: Output changed files for review
          echo "Changed files: $CHANGED_FILES"

          # Format the changed files correctly for setting as env variable
          for file in $CHANGED_FILES; do
            echo "Changed file: $file"  # Debugging output
            echo "CHANGED_FILE=$file" >> $GITHUB_ENV
          done

  deploy-admin:
    name: Deploy Admin Panel
    needs: get-changed-files
    if: contains(needs.get-changed-files.outputs.files, 'Admin/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.Github_OIDC }}
          aws-region: ap-south-1

      - name: Build React App
        working-directory: ./Admin
        env:
          REACT_APP_API_URL:        ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_IS_SKIP_OTP:  ${{ secrets.REACT_APP_IS_SKIP_OTP }}
        run: |
          npm ci
          npm run build

      - name: Deploy to S3
        run: aws s3 sync ./Admin/build s3://magilshe-admin-panel --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E27SJZON2LM1AS \
            --paths "/*"

  deploy-website:
    name: Deploy Website
    needs: get-changed-files
    if: contains(needs.get-changed-files.outputs.files, 'Website/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.Github_OIDC }}
          aws-region: us-east-1

      - name: Build React App
        working-directory: ./Website
        env:
          REACT_APP_API_URL:        ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_IS_SKIP_OTP:  ${{ secrets.REACT_APP_IS_SKIP_OTP }}
        run: |
          npm ci
          npm run build

      - name: Deploy to S3
        run: aws s3 sync ./Website/build s3://magilshe-website --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E37BBO03VZXP2F \
            --paths "/*"
