name: Deploy Magilshe Applications

on:
  push:
    branches:
      - dev  

permissions:
  id-token: write
  contents: read

jobs:
  deploy_admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC) - Admin
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Github_OIDC
          aws-region: ap-south-1

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and build React app (Admin)
        working-directory: Admin
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_IS_SKIP_OTP: ${{ secrets.REACT_APP_IS_SKIP_OTP }}
        run: |
          echo ${{ secrets.REACT_APP_API_URL }}
          pwd
          npm install
          npm run build
        env:
          CI: false

      - name: Deploy to S3 (Admin)
        run: |
          aws s3 sync Admin/build s3://magilshe-admin-panel --delete --region ap-south-1

      - name: Invalidate CloudFront cache (Admin)
        run: |
          aws cloudfront create-invalidation --distribution-id E27SJZON2LM1AS --paths "/*"

  deploy_website:
    runs-on: ubuntu-latest
    needs: deploy_admin  # Optional: run after admin is deployed

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC) - Website
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Github_OIDC
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and build React app (Website)
        working-directory: Website
        env:
          REACT_APP_BASE_URL: ${{ secrets.REACT_APP_BASE_URL }}
          REACT_APP_IS_SKIP_OTP: ${{ secrets.REACT_APP_IS_SKIP_OTP }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy to S3 (Website)
        run: |
          aws s3 sync Website/build s3://magilshe-website --delete --region us-east-1

      - name: Invalidate CloudFront cache (Website)
        run: |
          aws cloudfront create-invalidation --distribution-id E37BBO03VZXP2F --paths "/*"
