name: Deploy Magilshe Application

on:
  push:
    paths:
      - 'Admin/**'
      - 'Website/**'

permissions:
  id-token: write    # Needed for OIDC authentication
  contents: read     # Needed to checkout the repo

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      changed_dirs: ${{ steps.detect_changes.outputs.changed_dirs }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get Changed Directories
        id: detect_changes
        run: |
          # Get the changed directories using GitHub's commit references
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | cut -d/ -f1 | sort -u)

          echo "Changed directories: $CHANGED"

          # Use GitHub environment variable to pass the changed directories to next steps
          echo "changed_dirs=$CHANGED" >> $GITHUB_ENV  # This is the recommended way to pass data
          
          # If necessary, you can still set outputs (though GitHub recommends $GITHUB_ENV)
          echo "::set-output name=changed_dirs::$CHANGED"  # Deprecated but still works for now


  admin_deploy:
    needs: detect_changes
    runs-on: ubuntu-latest
    if: ${{ contains(needs.detect_changes.outputs.changed_dirs, 'Admin') }}  # Run if 'Admin' is in the changed directories

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Github_OIDC
          aws-region: ap-south-1

      - name: Install dependencies and build React app (Admin)
        working-directory: Admin
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_IS_SKIP_OTP: ${{ secrets.REACT_APP_IS_SKIP_OTP }}
        run: |
          npm ci
          npm run build

      - name: Deploy to S3 (Admin)
        run: |
          aws s3 sync Admin/build s3://magilshe-admin-panel --delete --region ap-south-1

      - name: Invalidate CloudFront cache (Admin)
        run: |
          aws cloudfront create-invalidation --distribution-id E27SJZON2LM1AS --paths "/*"

  website_deploy:
    needs: detect_changes
    runs-on: ubuntu-latest
    if: ${{ contains(needs.detect_changes.outputs.changed_dirs, 'Website') }}  # Run if 'Website' is in the changed directories

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Github_OIDC
          aws-region: us-east-1

      - name: Install dependencies and build React app (Website)
        working-directory: Website
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_IS_SKIP_OTP: ${{ secrets.REACT_APP_IS_SKIP_OTP }}
        run: |
          npm ci
          npm run build

      - name: Deploy to S3 (Website)
        run: |
          aws s3 sync Website/build s3://magilshe-website --delete --region us-east-1

      - name: Invalidate CloudFront cache (Website)
        run: |
          aws cloudfront create-invalidation --distribution-id E37BBO03VZXP2F --paths "/*"
