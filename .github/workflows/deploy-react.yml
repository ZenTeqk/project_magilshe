name: Deploy Magilshe Applications

on:
  push:
    branches:
      - dev
    paths:
      - 'Admin/**'
      - 'Website/**'

permissions:
  id-token: write
  contents: read

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      admin_changed: ${{ steps.set_outputs.outputs.admin_changed }}
      website_changed: ${{ steps.set_outputs.outputs.website_changed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Needed to compare last two commits

      - name: Detect changes in Admin and Website
        id: set_outputs
        run: |
          git diff --name-only HEAD^ HEAD

          if git diff --name-only HEAD^ HEAD | grep -q '^Admin/'; then
            echo "admin_changed=true" >> $GITHUB_OUTPUT
          else
            echo "admin_changed=false" >> $GITHUB_OUTPUT
          fi

          if git diff --name-only HEAD^ HEAD | grep -q '^Website/'; then
            echo "website_changed=true" >> $GITHUB_OUTPUT
          else
            echo "website_changed=false" >> $GITHUB_OUTPUT
          fi

  deploy_admin:
    needs: detect_changes
    if: needs.detect_changes.outputs.admin_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC) - Admin
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Github_OIDC
          aws-region: ap-south-1

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and build React app (Admin)
        working-directory: Admin
        env:
          REACT_APP_BASE_URL: ${{ secrets.REACT_APP_BASE_URL }}
          REACT_APP_IS_SKIP_OTP: ${{ secrets.REACT_APP_IS_SKIP_OTP }}
          CI: false
        run: |
          npm install
          npm run build
          echo REACT_APP_BASE_URL: ${{ secrets.REACT_APP_BASE_URL }}

      - name: Deploy to S3 (Admin)
        run: |
          aws s3 sync Admin/build s3://magilshe-admin-panel --delete --region ap-south-1

      - name: Invalidate CloudFront cache (Admin)
        run: |
          aws cloudfront create-invalidation --distribution-id E27SJZON2LM1AS --paths "/*"

  deploy_website:
    needs: detect_changes
    if: needs.detect_changes.outputs.website_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC) - Website
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Github_OIDC
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and build React app (Website)
        working-directory: Website
        env:
          REACT_APP_BASE_URL: ${{ secrets.REACT_APP_BASE_URL }}
          REACT_APP_IS_SKIP_OTP: ${{ secrets.REACT_APP_IS_SKIP_OTP }}
          CI: false
        run: |
          npm install
          npm run build

      - name: Deploy to S3 (Website)
        run: |
          aws s3 sync Website/build s3://magilshe-website --delete --region us-east-1

      - name: Invalidate CloudFront cache (Website)
        run: |
          aws cloudfront create-invalidation --distribution-id E37BBO03VZXP2F --paths "/*"
